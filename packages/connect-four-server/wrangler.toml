name = "stele-connect-four"
main = "src/index.ts"
compatibility_date = "2026-04-25"

# Single DO per worker, single room. Same scaffold as tic-tac-toe — only the
# game module under src/game.ts differs.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

